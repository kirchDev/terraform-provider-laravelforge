name: 🐛 Bug report
description: Something in the provider isn't working as expected
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the form below.
        For security vulnerabilities, see [SECURITY.md](https://github.com/kirchDev/terraform-provider-laravelforge/blob/main/SECURITY.md) instead.

  - type: input
    id: resource
    attributes:
      label: Affected resource / data source
      placeholder: e.g. laravelforge_server
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: Provider version + OpenTofu/Terraform version.
      placeholder: e.g. provider 0.2.0, OpenTofu 1.8.3
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Step-by-step instructions or a minimal failing command sequence.
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Logs, screenshots, related config, etc.
